<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biológia Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="quiz-container">

        <div class="top">
            <span id="question-number">Otázka 1 / 10</span>
            <span id="score">0 bodov</span>
        </div>

        <div class="progress">
            <div id="progress-bar"></div>
        </div>

        <h1>🧬 Biológia Quiz</h1>

        <div id="quiz">
            <h2 id="question">Otázka</h2>

            <div id="answers"></div>

            <button id="next-btn">Ďalšia otázka →</button>
        </div>

        <div id="result" class="hidden">
            <h2>🎉 Kvíz dokončený!</h2>
            <p id="result-text"></p>
            <button onclick="restartQuiz()">🔄 Skúsiť znova</button>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
